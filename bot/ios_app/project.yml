# XcodeGen project descriptor
# Instalare XcodeGen: brew install xcodegen
# Generare proiect: cd bot/ios_app && xcodegen generate

name: BotBridge
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  bundleIdPrefix: com.aibot

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"    # iPhone only
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: NO

targets:

  # ── Main App ────────────────────────────────────────────────────────────────
  BotBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
        includes: ["*.swift"]
      - path: Widget
        includes: ["BotActivityAttributes.swift"]  # shared model
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aibot.BotBridge
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/BotBridge.entitlements
    dependencies:
      - target: BotBridgeWidget
    info:
      path: Resources/Info.plist
      properties:
        NSReplayKitUsageDescription: "Botul captureaza ecranul pentru a analiza jocul cu AI."
        NSPhotoLibraryUsageDescription: "Salveaza screenshot-uri pentru analiza."
        UIBackgroundModes:
          - processing
          - fetch
        NSSupportsLiveActivities: YES
        NSSupportsLiveActivitiesFrequentUpdates: YES
        UILaunchScreen:
          UIColorName: systemBackground
        CFBundleDisplayName: AI Game Bot

  # ── Widget Extension (Dynamic Island + Lock Screen) ─────────────────────────
  BotBridgeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        includes: ["*.swift"]
      - path: Sources
        includes: ["BotActivity.swift"]  # shared model
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aibot.BotBridge.Widget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Widget.entitlements
    info:
      path: Resources/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ── Touch Injection Bundle (optional, necesita Developer Mode) ──────────────
  BotBridgeTouch:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Touch
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aibot.BotBridgeTouch
        TEST_TARGET_NAME: BotBridge
