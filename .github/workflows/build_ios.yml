name: Build BotBridge IPA

on:
  push:
    paths:
      - 'bot/ios_app/**'
  workflow_dispatch:        # porneste manual din GitHub Actions tab

jobs:
  build:
    runs-on: macos-14       # Mac cu Xcode 16, Apple Silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd bot/ios_app
          xcodegen generate

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (unsigned)
        run: |
          cd bot/ios_app
          xcodebuild \
            -project BotBridge.xcodeproj \
            -scheme BotBridge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BotBridge.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        run: |
          cd bot/ios_app
          mkdir -p build/Payload
          cp -r build/BotBridge.xcarchive/Products/Applications/BotBridge.app \
                build/Payload/BotBridge.app
          cd build
          zip -r BotBridge-unsigned.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotBridge-unsigned
          path: bot/ios_app/build/BotBridge-unsigned.ipa
          retention-days: 30

