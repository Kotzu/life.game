.stage::after {
  content: ''; position: absolute; inset: 0;
  box-shadow: inset 0 0 180px 60px rgba(0,0,0,0.75);
  pointer-events: none;
}
.demo-brand {
  position: fixed; top: 22px; left: 26px; z-index: 5;
  font-family: 'Oswald', 'Segoe UI', sans-serif;
  line-height: 0.98; letter-spacing: 0.02em;
  text-transform: uppercase; pointer-events: none;
}
.demo-brand .l1 { font-size: 30px; font-weight: 600; color: #efe9de; }
.demo-brand .l2 { font-size: 30px; font-weight: 600; color: var(--gold); }
.demo-brand .l3 {
  margin-top: 8px; font-family: 'Segoe UI', sans-serif; text-transform: none;
  font-size: 11.5px; letter-spacing: 0.02em; color: #8f887d; max-width: 300px; line-height: 1.45;
}
.demo-bar {
  position: fixed; top: 22px; right: 24px; z-index: 5;
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw;
}
.demo-bar button {
  font: inherit; font-size: 12px; cursor: pointer;
  color: var(--chip-text); background: var(--chip-bg);
  border: 1px solid var(--chip-line); border-radius: 999px;
  padding: 7px 14px;
}
.demo-bar button:hover { border-color: var(--gold); color: #e8e3da; }
.demo-bar button.active { border-color: var(--gold); color: var(--gold-2); background: #262119; }
.demo-bar .sep { width: 1px; background: var(--chip-line); margin: 4px 4px; }
#demo-toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px);
  z-index: 6; max-width: min(92vw, 720px);
  background: rgba(20, 18, 16, 0.95); color: var(--gold-2);
  border: 1px solid var(--chip-line); border-left: 3px solid var(--gold);
  border-radius: 8px; padding: 10px 16px;
  font-family: Consolas, 'SF Mono', monospace; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none;
}
#demo-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) {
  #demo-toast { transition: none; }
  .outfit-panel.shake { animation: none !important; }
}
@media (max-width: 720px) {
  .demo-brand .l1, .demo-brand .l2 { font-size: 22px; }
  .demo-brand .l3 { display: none; }
  .demo-bar { top: auto; bottom: 16px; right: 12px; left: 12px; max-width: none; justify-content: center; }
  #demo-toast { bottom: 72px; }
}

/* ================= the resource's REAL NUI stylesheet (verbatim) ========= */
:root {
  --bg: rgba(16, 15, 14, 0.96);
  --bg2: #1c1a18;
  --line: #35302a;
  --text: #e8e3da;
  --muted: #96908a;
  --accent: #c9a860;
  --accent2: #e6cf96;
  --danger: #c96060;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  background: transparent;
  overflow: hidden;
  user-select: none;
}

.hidden { display: none !important; }

#root {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

.panel {
  width: 420px; max-height: 80vh; overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--line);
  border-top: 2px solid var(--accent);
  border-radius: 10px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.65);
  color: var(--text);
}

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--line);
}

h1 {
  font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent2); font-weight: 600;
}

main { padding: 16px 20px 20px; }

.section-label {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); margin: 14px 0 6px;
}
.section-label:first-child { margin-top: 0; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }

button {
  font: inherit; cursor: pointer;
  background: var(--bg2); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 14px; font-size: 13px;
  transition: border-color 0.12s, background 0.12s;
}
button:hover { border-color: var(--accent); }
button.selected { border-color: var(--accent); background: #262119; color: var(--accent2); }
button.primary {
  width: 100%; margin-top: 16px;
  background: var(--accent); color: #17130c; font-weight: 600;
  border-color: var(--accent);
}
button.primary:hover { background: var(--accent2); }
button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
button.danger { border-color: var(--danger); color: var(--danger); width: 100%; margin-top: 16px; }
button.ghost { border: none; background: none; color: var(--muted); font-size: 14px; padding: 4px 8px; }
button.ghost:hover { color: var(--text); }
button.list { width: 100%; text-align: left; margin-bottom: 6px; }

input[type=text] {
  width: 100%; font: inherit; font-size: 13px;
  background: var(--bg2); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 12px; outline: none;
}
input[type=text]:focus { border-color: var(--accent); }

.note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
.warn {
  font-size: 12px; color: #d8b25c; background: #2a2214;
  border: 1px solid #4a3a1a; border-radius: 6px; padding: 8px 12px; margin-top: 10px;
}
.detail-line { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--text); }
.detail-line:last-child { border-bottom: none; }

/* concept-style SELECT OUTFIT panel */
.outfit-panel {
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg2);
  overflow: hidden;
}
.outfit-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent2);
}
.outfit-count { color: var(--muted); letter-spacing: 0.08em; }
.outfit-list { max-height: 260px; overflow-y: auto; padding: 6px; }
.outfit-row {
  padding: 9px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  color: var(--text); border: 1px solid transparent;
}
.outfit-row:hover { background: #221e17; }
.outfit-row.selected { border-color: var(--accent); background: #262119; color: var(--accent2); }
.outfit-foot {
  padding: 12px 14px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
}
.outfit-foot-name { color: var(--text); font-size: 14px; }
.outfit-foot-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }

.outfit-panel.shake { animation: ktr-shake 0.4s; border-color: var(--danger); }
@keyframes ktr-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

<!-- ============== the resource's REAL NUI markup (from index.html) ======= -->
<div id="root" class="hidden">
  <div class="panel">
    <header>
      <h1 id="title">Trophy Room</h1>
      <button id="closeBtn" class="ghost" title="Close">✕</button>
    </header>
    <main id="screen"></main>
  </div>
</div>

<div id="demo-toast" role="status"></div>

<script>
/* ================= the resource's REAL NUI script (verbatim) ============= */
/* Trophy Room NUI — dependency-free. All user-facing strings arrive from the
   Lua locale packs (data.strings) with English fallbacks kept here. */
'use strict';

const root = document.getElementById('root');
const screenEl = document.getElementById('screen');
const titleEl = document.getElementById('title');

const RESOURCE = (window.GetParentResourceName && window.GetParentResourceName()) || 'kotzu_trophy_room';

let STR = {};
function T(key, fallback) {
  return STR[key] || fallback;
}

function nui(name, data) {
  return fetch(`https://${RESOURCE}/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data || {}),
  }).catch(() => {});
}

function close() {
  root.classList.add('hidden');
  nui('ktr:close');
}
document.getElementById('closeBtn').addEventListener('click', close);
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) {
    node.append(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function chipRow(items, selectedId, onPick) {
  const row = el('div', { class: 'row' });
  for (const item of items) {
    const b = el('button', {
      class: item.id === selectedId ? 'selected' : '',
      onclick: () => {
        row.querySelectorAll('button').forEach((x) => x.classList.remove('selected'));
        b.classList.add('selected');
        onPick(item.id);
      },
    }, item.label);
    row.append(b);
  }
  return row;
}

/* ------------------------------------------------------------------ wizard */

function renderWizard(data) {
  titleEl.textContent = T('newDisplay', 'New Display');
  const state = {
    type: 'mannequin',
    gender: data.playerGender || 'male',
    outfitSource: 'current',
    savedId: null,
    poseId: (data.poses[0] || {}).id || 'neutral',
    platform: 'none',
    weaponKind: 'stand',
    itemName: '',
    label: '',
  };

  const body = el('div', {});

  body.append(el('div', { class: 'section-label' }, T('displayType', 'Display type')));
  const types = [
    { id: 'mannequin', label: T('mannequin', 'Mannequin') },
    { id: 'weapon', label: T('weapon', 'Weapon') },
  ];
  body.append(chipRow(types, state.type, (id) => { state.type = id; renderTypeSection(); }));

  const typeSection = el('div', {});
  body.append(typeSection);

  function renderTypeSection() {
    typeSection.replaceChildren();
    if (state.type === 'mannequin') {
      if (!data.manifestBuilt) {
        typeSection.append(el('div', { class: 'warn' }, T('manifestWarn',
          'Mannequin assets are not built (manifest v0). Run the asset pipeline first — placement will be refused.')));
      }
      typeSection.append(el('div', { class: 'section-label' }, T('gender', 'Gender')));
      typeSection.append(chipRow(
        [{ id: 'male', label: T('male', 'Male') }, { id: 'female', label: T('female', 'Female') }],
        state.gender, (id) => { state.gender = id; }));

      typeSection.append(el('div', { class: 'section-label' }, T('outfit', 'Outfit')));
      const outfitOpts = [
        { id: 'current', label: T('myCurrentOutfit', 'My current outfit') },
        { id: 'none', label: T('bareMannequin', 'Bare mannequin') },
      ];
      if (Array.isArray(data.savedOutfits) && data.savedOutfits.length) {
        outfitOpts.push({ id: 'saved', label: T('savedOutfit', 'Saved outfit…') });
      }
      const savedRow = el('div', {});
      typeSection.append(chipRow(outfitOpts, state.outfitSource, (id) => {
        state.outfitSource = id;
        state.savedId = null;
        savedRow.replaceChildren();
        if (id === 'saved') {
          // concept-style SELECT OUTFIT panel: list + count + selected + footer
          const list = Array.isArray(data.savedOutfits) ? data.savedOutfits : [];
          const panel = el('div', { class: 'outfit-panel' });
          const head = el('div', { class: 'outfit-head' },
            el('span', {}, T('selectOutfit', 'SELECT OUTFIT')),
            el('span', { class: 'outfit-count' }, `0 / ${list.length}`));
          const listEl = el('div', { class: 'outfit-list' });
          const footer = el('div', { class: 'outfit-foot' }, T('noOutfitSelected', 'No outfit selected'));
          list.forEach((o, i) => {
            const row = el('div', {
              class: 'outfit-row',
              onclick: () => {
                state.savedId = String(o.id);
                listEl.querySelectorAll('.outfit-row').forEach((r) => r.classList.remove('selected'));
                row.classList.add('selected');
                head.querySelector('.outfit-count').textContent = `${i + 1} / ${list.length}`;
                footer.replaceChildren(
                  el('div', { class: 'outfit-foot-name' }, o.label),
                  el('div', { class: 'outfit-foot-sub' }, o.model || ''));
              },
            }, o.label);
            listEl.append(row);
          });
          panel.append(head, listEl, footer);
          savedRow.append(panel);
        }
      }));
      typeSection.append(savedRow);

      typeSection.append(el('div', { class: 'section-label' }, T('pose', 'Pose')));
      typeSection.append(chipRow(data.poses, state.poseId, (id) => { state.poseId = id; }));

      typeSection.append(el('div', { class: 'section-label' }, T('stand', 'Stand')));
      typeSection.append(chipRow(data.platforms, state.platform, (id) => { state.platform = id; }));
    } else {
      if (!data.inventoryFunctional) {
        typeSection.append(el('div', { class: 'warn' }, T('inventoryWarn',
          'No functional inventory bridge detected — weapon displays are disabled.')));
      }
      typeSection.append(el('div', { class: 'section-label' }, T('mount', 'Mount')));
      typeSection.append(chipRow([
        { id: 'wall', label: T('wallMount', 'Wall mount') },
        { id: 'stand', label: T('floorStand', 'Floor stand') },
        { id: 'case', label: T('glassCase', 'Glass case') },
      ], state.weaponKind, (id) => { state.weaponKind = id; }));
      typeSection.append(el('div', { class: 'section-label' }, T('weaponItemName', 'Weapon item name')));
      typeSection.append(el('input', {
        type: 'text', placeholder: 'weapon_pistol',
        oninput: (e) => { state.itemName = e.target.value; },
      }));
      typeSection.append(el('div', { class: 'note' }, T('weaponNote',
        'The server verifies you own this exact weapon (by serial) and removes it from your inventory atomically. Retrieve it any time from the display.')));
    }
  }
  renderTypeSection();

  body.append(el('div', { class: 'section-label' }, T('labelOptional', 'Label (optional)')));
  body.append(el('input', {
    type: 'text', maxlength: '48', placeholder: T('labelPlaceholder', 'e.g. Patrol uniform 2024'),
    oninput: (e) => { state.label = e.target.value; },
  }));

  const placeBtn = el('button', {
    class: 'primary',
    onclick: () => {
      if (state.type === 'mannequin') {
        if (state.outfitSource === 'saved' && !state.savedId) {
          const panel = typeSection.querySelector('.outfit-panel');
          if (panel) { panel.classList.add('shake'); setTimeout(() => panel.classList.remove('shake'), 450); }
          return; // must pick a saved outfit first
        }
        nui('ktr:placeMannequin', {
          gender: state.gender,
          outfitSource: state.outfitSource === 'none' ? 'none' : (state.outfitSource === 'saved' ? 'saved' : 'current'),
          savedId: state.savedId,
          poseId: state.poseId,
          platform: state.platform,
          label: state.label,
        });
      } else {
        if (!data.inventoryFunctional || !state.itemName.trim()) return;
        nui('ktr:placeWeapon', {
          kind: state.weaponKind,
          itemName: state.itemName.trim(),
          label: state.label,
        });
      }
      root.classList.add('hidden');
    },
  }, T('startPlacement', 'Start placement'));
  body.append(placeBtn);
  body.append(el('div', { class: 'note' }, T('placementHint',
    'Placement: arrows move · Q/E rotate · PgUp/PgDn height · Shift fine · G ground · Tab snap · X collision · Enter confirm · Backspace cancel')));

  screenEl.replaceChildren(body);
}

/* ------------------------------------------------------------------ others */

function renderDetails(data) {
  titleEl.textContent = data.display.label || T('displayFallback', 'Display');
  const body = el('div', {});
  for (const line of data.lines || []) {
    body.append(el('div', { class: 'detail-line' }, line));
  }
  body.append(el('div', { class: 'section-label' }, T('rename', 'Rename')));
  const nameIn = el('input', { type: 'text', maxlength: '48', value: data.display.label || '' });
  const descIn = el('input', {
    type: 'text', maxlength: '256', value: data.display.description || '',
    placeholder: T('descriptionPlaceholder', 'Description'), style: 'margin-top:8px',
  });
  body.append(nameIn, descIn);
  body.append(el('button', {
    class: 'primary',
    onclick: () => {
      nui('ktr:rename', { uid: data.display.uid, label: nameIn.value, description: descIn.value });
      root.classList.add('hidden');
    },
  }, T('saveBtn', 'Save')));
  screenEl.replaceChildren(body);
}

function renderPoses(data) {
  titleEl.textContent = T('poseTitle', 'Pose');
  const body = el('div', {});
  for (const pose of data.poses) {
    body.append(el('button', {
      class: 'list' + (pose.id === data.current ? ' selected' : ''),
      onclick: () => {
        nui('ktr:setPose', { uid: data.uid, poseId: pose.id });
        root.classList.add('hidden');
      },
    }, pose.label));
  }
  screenEl.replaceChildren(body);
}

function renderConfirmRemove(data) {
  titleEl.textContent = T('removeTitle', 'Remove display');
  const body = el('div', {});
  const confirmTemplate = T('removeConfirm', 'Remove "%s"? This cannot be undone.');
  body.append(el('div', { class: 'detail-line' }, confirmTemplate.replace('%s', data.label)));
  body.append(el('button', {
    class: 'danger',
    onclick: () => {
      nui('ktr:confirmRemove', { uid: data.uid });
      root.classList.add('hidden');
    },
  }, T('removeBtn', 'Remove')));
  screenEl.replaceChildren(body);
}

function renderOptions(data) {
  titleEl.textContent = T('interact', 'Interact');
  const body = el('div', {});
  data.options.forEach((label, i) => {
    body.append(el('button', {
      class: 'list',
      onclick: () => {
        nui('ktr:optionSelected', { index: i + 1 }); // Lua is 1-indexed
        root.classList.add('hidden');
      },
    }, label));
  });
  screenEl.replaceChildren(body);
}

/* ---------------------------------------------------------------- messages */

window.addEventListener('message', (event) => {
  const { action, data } = event.data || {};
  if (action === 'close') { root.classList.add('hidden'); return; }
  if (action !== 'open' || !data) return;
  if (data.strings) STR = data.strings;
  root.classList.remove('hidden');
  switch (data.screen) {
    case 'wizard': renderWizard(data); break;
    case 'details': renderDetails(data); break;
    case 'poses': renderPoses(data); break;
    case 'confirmRemove': renderConfirmRemove(data); break;
    case 'options': renderOptions(data); break;
    default: close();
  }
});

</script>
<script>

/* ---------------- demo harness (not part of the shipped resource) -------- */
(function () {
  'use strict';

  const STRINGS = {
    en: {
      newDisplay: 'New Display', displayType: 'Display type',
      mannequin: 'Mannequin', weapon: 'Weapon',
      gender: 'Gender', male: 'Male', female: 'Female',
      outfit: 'Outfit', myCurrentOutfit: 'My current outfit',
      bareMannequin: 'Bare mannequin', savedOutfit: 'Saved outfit…',
      selectOutfit: 'SELECT OUTFIT', noOutfitSelected: 'No outfit selected',
      pose: 'Pose', stand: 'Stand', mount: 'Mount',
      wallMount: 'Wall mount', floorStand: 'Floor stand', glassCase: 'Glass case',
      weaponItemName: 'Weapon item name',
      weaponNote: 'The server verifies you own this exact weapon (by serial) and removes it from your inventory atomically. Retrieve it any time from the display.',
      labelOptional: 'Label (optional)', labelPlaceholder: 'e.g. Patrol uniform 2024',
      startPlacement: 'Start placement',
      placementHint: 'Placement: arrows move · Q/E rotate · PgUp/PgDn height · Shift fine · G ground · Tab snap · X collision · Enter confirm · Backspace cancel',
      manifestWarn: 'Mannequin assets are not built (manifest v0). Run the asset pipeline first — placement will be refused.',
      inventoryWarn: 'No functional inventory bridge detected — weapon displays are disabled.',
      rename: 'Rename', saveBtn: 'Save', poseTitle: 'Pose', interact: 'Interact',
      removeTitle: 'Remove display', removeConfirm: 'Remove "%s"? This cannot be undone.',
      removeBtn: 'Remove', descriptionPlaceholder: 'Description', displayFallback: 'Display',
    },
    ro: {
      newDisplay: 'Exponat nou', displayType: 'Tip de exponat',
      mannequin: 'Manechin', weapon: 'Armă',
      gender: 'Gen', male: 'Bărbat', female: 'Femeie',
      outfit: 'Ținută', myCurrentOutfit: 'Ținuta mea actuală',
      bareMannequin: 'Manechin gol', savedOutfit: 'Ținută salvată…',
      selectOutfit: 'ALEGE ȚINUTA', noOutfitSelected: 'Nicio ținută selectată',
      pose: 'Poză', stand: 'Suport', mount: 'Montare',
      wallMount: 'Pe perete', floorStand: 'Stativ de podea', glassCase: 'Vitrină de sticlă',
      weaponItemName: 'Numele item-ului de armă',
      weaponNote: 'Serverul verifică (după serie) că deții exact această armă și o scoate atomic din inventar. O poți recupera oricând de pe exponat.',
      labelOptional: 'Etichetă (opțional)', labelPlaceholder: 'ex. Uniformă de patrulare 2024',
      startPlacement: 'Începe plasarea',
      placementHint: 'Plasare: săgeți mută · Q/E rotește · PgUp/PgDn înălțime · Shift fin · G sol · Tab snap · X coliziune · Enter confirmă · Backspace anulează',
      manifestWarn: 'Asset-urile de manechin nu sunt generate (manifest v0). Rulează întâi pipeline-ul — plasarea va fi refuzată.',
      inventoryWarn: 'Niciun bridge de inventar funcțional — exponatele de arme sunt dezactivate.',
      rename: 'Redenumește', saveBtn: 'Salvează', poseTitle: 'Poză', interact: 'Interacționează',
      removeTitle: 'Elimină exponatul', removeConfirm: 'Elimini „%s"? Acțiunea nu poate fi anulată.',
      removeBtn: 'Elimină', descriptionPlaceholder: 'Descriere', displayFallback: 'Exponat',
    },
  };

  const POSES = {
    en: ['Default Stand','Arms Crossed','Hands Behind Back','Hands On Belt',
         'Military Attention','Military At Ease','Security Guard','Inspecting','Relaxed'],
    ro: ['Poziție standard','Brațe încrucișate','Mâini la spate','Mâini pe centură',
         'Drepți (militar)','Pe loc repaus','Agent de pază','Inspectează','Relaxat'],
  };
  const POSE_IDS = ['neutral','arms_crossed','hands_back','hands_on_belt',
                    'attention','at_ease','guard','inspect','relaxed'];
  const PLATFORMS = {
    en: ['No stand','Round base','Display plinth'],
    ro: ['Fără suport','Bază rotundă','Piedestal'],
  };
  const OUTFITS = ['Police Uniform','Sheriff Patrol','FIB Tactical','Black Suit','White Suit',
    'Mechanic Overall','Street Outfit','Biker Outfit','Security','EUP Outfit',
    'Ceremonial Dress','Winter Patrol'];

  let lang = 'ro';

  function mockData() {
    return {
      strings: STRINGS[lang],
      poses: POSE_IDS.map((id, i) => ({ id, label: POSES[lang][i] })),
      platforms: ['none','round','plinth'].map((id, i) => ({ id, label: PLATFORMS[lang][i] })),
      manifestBuilt: true,
      inventoryFunctional: true,
      playerGender: 'male',
      savedOutfits: OUTFITS.map((label, i) => ({ id: i + 1, label, model: 'mp_m_freemode_01' })),
    };
  }

  function openScreen(screen) {
    const d = mockData();
    if (screen === 'wizard') Object.assign(d, { screen: 'wizard' });
    else if (screen === 'poses') Object.assign(d, { screen: 'poses', uid: 'demo', current: 'attention' });
    else if (screen === 'details') Object.assign(d, {
      screen: 'details',
      display: { uid: 'demo-uid', label: lang === 'ro' ? 'Uniformă patrulare' : 'Patrol uniform',
                 description: lang === 'ro' ? 'Manechin, poză Drepți' : 'Mannequin, Attention pose',
                 displayType: 'mannequin', gender: 'male', poseId: 'attention', platform: 'plinth' },
      lines: lang === 'ro'
        ? ['mannequin „Uniformă patrulare"', 'Manechin, poză Drepți']
        : ['mannequin "Patrol uniform"', 'Mannequin, Attention pose'],
    });
    else if (screen === 'confirmRemove') Object.assign(d, {
      screen: 'confirmRemove', uid: 'demo-uid',
      label: lang === 'ro' ? 'Uniformă patrulare' : 'Patrol uniform',
    });
    else if (screen === 'options') Object.assign(d, {
      screen: 'options',
      options: lang === 'ro'
        ? ['Inspectează','Probează ținuta (temporar)','Schimbă ținuta','Schimbă poza','Mută','Elimină']
        : ['Inspect','Try outfit (temporary)','Change outfit','Change pose','Move','Remove'],
    });
    window.postMessage({ action: 'open', data: d }, '*');
  }

  // intercept the NUI callbacks the real app.js sends and surface them as toasts
  const origFetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    const u = String(url);
    if (u.includes('kotzu_trophy_room/ktr:')) {
      const action = u.split('/').pop();
      let body = '';
      try { body = JSON.stringify(JSON.parse(opts.body)); } catch (e) { /* noop */ }
      if (action !== 'ktr:close') toast(action + '  ' + body);
      return Promise.resolve({ ok: true });
    }
    return origFetch(url, opts);
  };

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('demo-toast');
    t.textContent = (lang === 'ro' ? 'trimis către client:  ' : 'sent to client:  ') + msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
  }

  function bind() {
    document.querySelectorAll('[data-screen]').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('[data-screen]').forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        openScreen(b.dataset.screen);
      });
    });
    document.querySelectorAll('[data-lang]').forEach((b) => {
      b.addEventListener('click', () => {
        lang = b.dataset.lang;
        document.querySelectorAll('[data-lang]').forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        const current = document.querySelector('[data-screen].active');
        openScreen(current ? current.dataset.screen : 'wizard');
      });
    });
    openScreen('wizard');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();

</script>
